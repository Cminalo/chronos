[project]
authors = [{name = "cminalo", email = "cminalopez@outlook.com"}]
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "psutil>=7.2.0",
    "rich>=14.3.0",
    "typing-extensions>=4.12,<5",
]
name = "chronos-logger"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.8.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Cminalo/chronos"
Repository = "https://github.com/Cminalo/chronos"
Issues = "https://github.com/Cminalo/chronos/issues"


[dependency-groups]
dev = [
    "build>=1.5.0,<2",
    "pytest>=8,<9",
    "pyrefly>=1.0,<2",
    "ruff>=0.9,<1",
    "sphinx>=8,<10",
    "myst-parser>=5,<6",
    "sphinx-immaterial>=0.13,<1",
]


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: Pure function tests, no I/O.",
    "component: Multiple functions working together, no network.",
    "system: End-to-end workflow reflecting a real user use case.",
    "live: Tests that make real HTTP requests (opt-in; run via test-live).",
]

[tool.pyrefly]
project-includes = ["src/chronos"]
project-excludes = ["**/.[!/.]*/**"]
python-version = "3.11"
preset = "strict"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]


[tool.pixi.pypi-dependencies]
chronos-logger = { path = ".", editable = true }
build = ">=1.5.0,<2"
pytest = ">=8,<9"
pyrefly = ">=1.0,<2"
ruff = ">=0.9,<1"
sphinx = ">=8,<10"
myst-parser = ">=5,<6"
sphinx-immaterial = ">=0.13,<1"

[tool.pixi.tasks]
test = "pixi run python -m pytest -m 'not live'"
test-live = "pixi run python -m pytest -m live"
test-quick = "pixi run python -m pytest -m '(unit or component) and not live'"
test-unit = "pixi run python -m pytest -m 'unit and not live'"
test-component = "pixi run python -m pytest -m 'component and not live'"
test-system = "pixi run python -m pytest -m 'system and not live'"
docs = "pixi run sphinx-build -b html docs/chronos docs/chronos/_build/html"
lint = "pixi run ruff check"
lint-check = "pixi run ruff check --diff"
fmt = "pixi run ruff format"
fmt-check = "pixi run ruff format --diff"
typecheck = "pyrefly check"
build = "pixi run python -m build"
comments-add = "pixi run python scripts/comments.py add"
comments-strip = "pixi run python scripts/comments.py strip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pixi.dependencies]
python = "3.13.*"
nodejs = ">=25.6.1,<25.7"
lazygit = ">=0.59.0,<0.60"
