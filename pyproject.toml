[project]
authors = [{name = "cminalo", email = "cminalopez@outlook.com"}]
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "psutil>=7.2.0",
    "rich>=14.3.0",
]
name = "chronos-logger"
requires-python = ">= 3.10"
version = "0.8.1"


[project.optional-dependencies]
dev = [
    "build>=1.5.0,<2",
    "pytest>=8,<9",
    "mypy>=1.15,<2",
    "ruff>=0.9,<1",
    "sphinx>=8,<10",
    "myst-parser>=5,<6",
    "sphinx-immaterial>=0.13,<1",
]


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: Pure function tests, no I/O.",
    "component: Multiple functions working together, no network.",
    "system: End-to-end workflow reflecting a real user use case.",
    "live: Tests that make real HTTP requests (skipped by default).",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]


[tool.pixi.pypi-dependencies]
chronos-logger = { path = ".", editable = true }
build = ">=1.5.0,<2"
pytest = ">=8,<9"
mypy = ">=1.15,<2"
ruff = ">=0.9,<1"
sphinx = ">=8,<10"
myst-parser = ">=5,<6"
sphinx-immaterial = ">=0.13,<1"

[tool.pixi.tasks]
test = "pixi run python -m pytest"
test-quick = "pixi run python -m pytest -m 'unit or component'"
test-unit = "pixi run python -m pytest -m unit"
test-component = "pixi run python -m pytest -m component"
test-system = "pixi run python -m pytest -m system"
docs = "pixi run sphinx-build -b html docs/chronos docs/chronos/_build/html"
lint = "pixi run ruff check"
lint-check = "pixi run ruff check --diff"
fmt = "pixi run ruff format"
fmt-check = "pixi run ruff format --diff"
typecheck = "mypy src/chronos"
build = "pixi run python -m build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pixi.dependencies]
python = "3.13.*"
nodejs = ">=25.6.1,<25.7"
lazygit = ">=0.59.0,<0.60"
